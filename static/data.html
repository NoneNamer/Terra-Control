<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TC - Data</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class='container'>
        <h1>Terrarium Controller</h1><hr>
        <nav>
            <a href="index.html">Home</a>
            <a href="schedule.html">Schedule</a>
            <a href="data.html">Data</a>
            <a href="led.html">LED Control</a>
        </nav><hr>

        <h2>Logs and Data</h2>

        <div class="data-section">
            <h3>Log Entries</h3>
            <div class="log-controls">
                <select id="log-filter" aria-label="Log level">
                    <option value="all">All entries</option>
                    <option value="info">Info</option>
                    <option value="warning">Warnings</option>
                    <option value="error">Errors</option>
                </select>
                <label>Show <input type="number" id="log-limit" min="10" max="1000" value="50"> entries</label>
                <button id="refresh-logs" class="btn">Refresh</button>
            </div>
            <div id="log-entries" class="log-entries">
                <p class="loading">Loading log entries...</p>
            </div>
        </div>

        <div class="data-section">
            <h3>Readings of a Day</h3>
            <div class="log-controls">
                <input type="date" id="day" aria-label="Day">
                <button id="load-day" class="btn">Show</button>
            </div>
            <div class="table-wrapper readings">
                <table class="schedule-table">
                    <thead>
                        <tr><th>Time</th><th>Basking &deg;C</th><th>Cool side &deg;C</th><th>Air &deg;C</th><th>Humidity %</th></tr>
                    </thead>
                    <tbody id="day-readings"></tbody>
                </table>
            </div>
            <p id="day-message" class="message"></p>
        </div>

        <div class="data-section">
            <h3>Download</h3>
            <div class="download-options">
                <div class="download-option">
                    <h4>Log Files</h4>
                    <p>All log files plus the database log (zip)</p>
                    <button id="download-logs" class="btn">Download logs</button>
                </div>
                <div class="download-option">
                    <h4>Sensor Data</h4>
                    <p>Readings and lamp states as CSV (at most one year)</p>
                    <div class="date-range">
                        <label for="start-date">From:</label>
                        <input type="date" id="start-date">
                        <label for="end-date">To:</label>
                        <input type="date" id="end-date">
                    </div>
                    <button id="download-sensor-data" class="btn">Download CSV</button>
                </div>
            </div>
            <p id="download-message" class="message"></p>
        </div>
    </div>

    <script src="api.js"></script>
    <script>
        const isoDate = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

        async function loadLogEntries() {
            const container = document.getElementById('log-entries');
            const filter = document.getElementById('log-filter').value;
            const limit = document.getElementById('log-limit').value || 50;
            try {
                const logs = await API.get(`/logs?filter=${encodeURIComponent(filter)}&limit=${encodeURIComponent(limit)}`);
                container.innerHTML = '';
                if (logs.length === 0) {
                    container.innerHTML = '<p class="no-data">No log entries found.</p>';
                    return;
                }
                for (const log of logs) {
                    const entry = document.createElement('div');
                    entry.className = `log-entry ${log.level.toLowerCase()}`;
                    for (const [cls, text] of [['log-timestamp', log.timestamp], ['log-level', log.level], ['log-message', log.message]]) {
                        const span = document.createElement('span');
                        span.className = cls;
                        span.textContent = text;
                        entry.appendChild(span);
                    }
                    container.appendChild(entry);
                }
            } catch (e) {
                container.innerHTML = '';
                const p = document.createElement('p');
                p.className = 'error';
                p.textContent = `Error loading logs: ${e.message}`;
                container.appendChild(p);
            }
        }

        async function loadDay() {
            const day = document.getElementById('day').value;
            const tbody = document.getElementById('day-readings');
            const msg = document.getElementById('day-message');
            tbody.innerHTML = '';
            try {
                const points = await API.get(`/graph/date/${day}`);
                for (const p of points) {
                    const tr = document.createElement('tr');
                    for (const v of [p.time, fmt(p.temperature), fmt(p.coolZoneTemp), fmt(p.airTemp), fmt(p.humidity)]) {
                        const td = document.createElement('td');
                        td.textContent = v;
                        tr.appendChild(td);
                    }
                    tbody.appendChild(tr);
                }
                showMessage(msg, points.length ? `${points.length} readings` : 'No readings for this day', points.length ? 'ok' : 'error');
            } catch (e) {
                showMessage(msg, e.message, 'error');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const today = new Date();
            const monthAgo = new Date();
            monthAgo.setDate(today.getDate() - 30);
            document.getElementById('end-date').value = isoDate(today);
            document.getElementById('start-date').value = isoDate(monthAgo);
            document.getElementById('day').value = isoDate(today);

            document.getElementById('refresh-logs').addEventListener('click', loadLogEntries);
            document.getElementById('log-filter').addEventListener('change', loadLogEntries);
            document.getElementById('log-limit').addEventListener('change', loadLogEntries);
            document.getElementById('load-day').addEventListener('click', loadDay);

            const downloadMsg = document.getElementById('download-message');
            document.getElementById('download-logs').addEventListener('click', async () => {
                try {
                    await API.download('/logs/download', 'terrarium_logs.zip');
                } catch (e) {
                    showMessage(downloadMsg, `Download failed: ${e.message}`, 'error');
                }
            });
            document.getElementById('download-sensor-data').addEventListener('click', async () => {
                const start = document.getElementById('start-date').value;
                const end = document.getElementById('end-date').value;
                try {
                    await API.download(`/data/download?start=${start}&end=${end}`, `terrarium_data_${start}_to_${end}.csv`);
                } catch (e) {
                    showMessage(downloadMsg, `Download failed: ${e.message}`, 'error');
                }
            });

            loadLogEntries();
            loadDay();
        });
    </script>
</body>
</html>
