<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jenkins Is watching</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class='container'>
        <h1>Terrarium Controller</h1><hr>
        <nav>
            <a href="index.html">Home</a>
            <a href="schedule.html">Schedule</a>
            <a href="data.html">Data</a>
            <a href="led.html">LED Control</a>
        </nav><hr>

        <h2>Current Readings</h2>
        <p>Basking Temperature: <span id="baskingTemp">--</span>&deg;C</p>
        <p>Cool Zone Temperature: <span id="coolZoneTemp">--</span>&deg;C</p>
        <p>Air Temperature: <span id="airTemp">--</span>&deg;C</p>
        <p>Humidity: <span id="humidity">--</span>%</p>
        <p>Enclosure Temperature: <span id="enclosureTemp">--</span>&deg;C</p><hr>

        <div class="graph-container">
            <div class="graph-box">
                <canvas id="todayGraph"></canvas>
            </div>
            <div class="graph-box">
                <canvas id="yesterdayGraph"></canvas>
            </div>
        </div><br><br><hr>
        <h2>Lamp Status</h2>
        <p>UV1: <span id="UV1Status">--</span></p>
        <p>UV2: <span id="UV2Status">--</span></p>
        <p>Heat: <span id="heatStatus">--</span> <span id="heatBlock"></span></p>
        <p>LEDs: <span id="ledStatus">--</span></p>
        <br><br><hr>
    </div>

    <script src='https://cdn.jsdelivr.net/npm/chart.js'></script>
    <script>
        // Charts for today and yesterday
        let todayChart, yesterdayChart;
        
        // Function to create a chart
        function createChart(ctx, data, title) {
            return new Chart(ctx, {
                type: 'line',
                data: {
                    labels: data.map(d => d.time),
                    datasets: [
                        {
                            label: 'Basking Temp',
                            data: data.map(d => d.temperature),
                            borderColor: 'rgb(255, 99, 132)',
                            fill: false
                        },
                        {
                            label: 'Cool Zone Temp',
                            data: data.map(d => d.coolZoneTemp),
                            borderColor: 'rgb(54, 162, 235)',
                            fill: false
                        },
                        {
                            label: 'Humidity',
                            data: data.map(d => d.humidity),
                            borderColor: 'rgb(75, 192, 192)',
                            fill: false
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        title: {
                            display: true,
                            text: title
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            max: 70
                        }
                    }
                }
            });
        }

        // Fetch current values from API
        async function fetchCurrentValues() {
            try {
                const response = await fetch('/api/values');
                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }
                
                const data = await response.json();
                
                // Sensor values are null when a sensor could not be read
                const fmt = v => (v === null || v === undefined) ? '--' : v.toFixed(1);
                document.getElementById('baskingTemp').textContent = fmt(data.baskingTemp);
                document.getElementById('coolZoneTemp').textContent = fmt(data.coolZoneTemp);
                document.getElementById('airTemp').textContent = fmt(data.airTemp);
                document.getElementById('humidity').textContent = fmt(data.humidity);
                document.getElementById('enclosureTemp').textContent = fmt(data.enclosureTemp);

                const onOff = v => v ? '✅ on' : '❌ off';
                document.getElementById('UV1Status').textContent = onOff(data.uv1On);
                document.getElementById('UV2Status').textContent = onOff(data.uv2On);
                document.getElementById('heatStatus').textContent = onOff(data.heatOn);
                document.getElementById('ledStatus').textContent = onOff(data.ledOn);
                document.getElementById('heatBlock').textContent =
                    data.heatBlock ? `(blocked: ${data.heatBlock.reason})` : '';
                
            } catch (error) {
                console.error('Error fetching current values:', error);
            }
        }

        // Fetch graph data for today
        async function fetchTodayGraphData() {
            try {
                const response = await fetch('/api/graph/today');
                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }
                
                const data = await response.json();
                
                // Get current date for title
                const today = new Date();
                const formattedDate = today.toLocaleDateString('en-US', { 
                    month: 'short', 
                    day: 'numeric', 
                    year: 'numeric' 
                });
                
                // Create or update today's chart
                const todayCtx = document.getElementById('todayGraph').getContext('2d');
                if (todayChart) {
                    todayChart.data.labels = data.map(d => d.time);
                    todayChart.data.datasets[0].data = data.map(d => d.temperature);
                    todayChart.data.datasets[1].data = data.map(d => d.coolZoneTemp);
                    todayChart.data.datasets[2].data = data.map(d => d.humidity);
                    todayChart.update();
                } else {
                    todayChart = createChart(todayCtx, data, `Data for ${formattedDate}`);
                }
                
            } catch (error) {
                console.error('Error fetching today\'s graph data:', error);
            }
        }

        // Fetch graph data for yesterday
        async function fetchYesterdayGraphData() {
            try {
                const response = await fetch('/api/graph/yesterday');
                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }
                
                const data = await response.json();
                
                // Get yesterday's date for title
                const today = new Date();
                const yesterday = new Date(today);
                yesterday.setDate(yesterday.getDate() - 1);
                const formattedDate = yesterday.toLocaleDateString('en-US', { 
                    month: 'short', 
                    day: 'numeric', 
                    year: 'numeric' 
                });
                
                // Create or update yesterday's chart
                const yesterdayCtx = document.getElementById('yesterdayGraph').getContext('2d');
                if (yesterdayChart) {
                    yesterdayChart.data.labels = data.map(d => d.time);
                    yesterdayChart.data.datasets[0].data = data.map(d => d.temperature);
                    yesterdayChart.data.datasets[1].data = data.map(d => d.coolZoneTemp);
                    yesterdayChart.data.datasets[2].data = data.map(d => d.humidity);
                    yesterdayChart.update();
                } else {
                    yesterdayChart = createChart(yesterdayCtx, data, `Data for ${formattedDate}`);
                }
                
            } catch (error) {
                console.error('Error fetching yesterday\'s graph data:', error);
            }
        }

        // Initial data load
        fetchCurrentValues();
        fetchTodayGraphData();
        fetchYesterdayGraphData();

        // Set up periodic refresh (every 60 seconds)
        setInterval(() => {
            fetchCurrentValues();
            fetchTodayGraphData();
        }, 60000);
    </script>
</body>
</html>
